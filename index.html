<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Biodata</title>
  <link rel="icon" type="image/png" href="edward.png">
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #007aff;
      --border: #e5e7eb;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      background: linear-gradient(180deg, #f9fafb 0%, #e9ecef 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    h2 {
      margin: 4px 0 12px;
      font-size: 18px;
      color: var(--muted);
      font-weight: 500;
    }

    p {
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .links a {
      display: inline-block;
      margin: 4px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #f3f4f6;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: 0.2s;
    }

    .links a:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="edward.png" alt="My Profile Picture" class="avatar">
    <h1>Edward</h1>
    <h2>CTF Enthusiast</h2>

    <p>
      how do i code, i forgot.. anyway here is my simple website cuz my brain  is uh melt yes.
    </p>

    <div class="links">
      <a href="https://edwardlmfao.github.io/main.html" target="_blank">Archive</a>
    </div>

    <footer>©EdwardEricus</footer>
  </main>
</body>
</html>
